name: Publish character AI workers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        kind: [kimodo, skintokens]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Contract tests
        run: python3 -m unittest discover -s service -p 'test_*.py' -v
      - name: Free build disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: service/Dockerfile
          target: ${{ matrix.kind }}
          push: true
          tags: |
            ghcr.io/i3oot/${{ matrix.kind }}-runpod-worker:${{ github.sha }}
            ghcr.io/i3oot/${{ matrix.kind }}-runpod-worker:latest
          labels: org.opencontainers.image.source=https://github.com/i3oot/character-ai-runpod-workers
          cache-from: type=gha,scope=${{ matrix.kind }}
          cache-to: type=gha,mode=min,scope=${{ matrix.kind }}
